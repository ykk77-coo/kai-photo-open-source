<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 475" role="img" aria-labelledby="title desc">
  <title id="title">作品网格与相册章节</title>
  <desc id="desc">左侧统一列宽与间距保留各图画幅，右侧先安排横幅，再留白切换到竖幅与文字。</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#8d9990"/><stop offset="1" stop-color="#354d4c"/></linearGradient>
    <symbol id="scenery" viewBox="0 0 240 150" preserveAspectRatio="xMidYMid slice">
      <rect width="240" height="150" fill="url(#sky)"/>
      <circle cx="171" cy="47" r="26" fill="#e1c59c"/>
      <path d="M0 120 60 62 131 128 178 80 240 112V150H0Z" fill="#243c3d"/>
    </symbol>
    <style>text{font-family:system-ui,"Microsoft YaHei","PingFang SC",sans-serif;fill:#322e28}.heading{font-size:30px;font-weight:650}.note{font-size:21px;fill:#564d42}</style>
  </defs>
  <rect width="1080" height="475" rx="22" fill="#f5efe4"/>
  <text class="heading" x="42" y="56">作品网格</text>
  <text class="heading" x="565" y="56">旅行相册</text>
  <rect x="42" y="82" width="473" height="295" rx="13" fill="#252925"/>
  <use href="#scenery" x="62" y="105" width="133" height="81"/>
  <use href="#scenery" x="210" y="105" width="133" height="159" opacity=".76"/>
  <use href="#scenery" x="358" y="105" width="133" height="111" opacity=".92"/>
  <use href="#scenery" x="62" y="202" width="133" height="148" opacity=".78"/>
  <use href="#scenery" x="210" y="280" width="133" height="70"/>
  <use href="#scenery" x="358" y="232" width="133" height="118" opacity=".75"/>
  <rect x="565" y="82" width="473" height="295" rx="13" fill="#fffaf0" stroke="#d4c9b7"/>
  <use href="#scenery" x="590" y="104" width="421" height="120"/>
  <use href="#scenery" x="631" y="240" width="90" height="120" opacity=".81"/>
  <path d="M768 279H954M768 301H930M768 323H872" stroke="#b8a58c" stroke-width="4" stroke-linecap="round"/>
  <text class="note" x="42" y="428">同列对齐，用间距维持扫看节奏。</text>
  <text class="note" x="565" y="428">先交代环境，再留出竖幅和手记的位置。</text>
</svg>
